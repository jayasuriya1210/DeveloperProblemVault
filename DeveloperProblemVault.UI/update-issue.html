<!DOCTYPE html>
<html>

<head>
    <title>Update Issue</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Update Issue</h1>

<form>

<label>Issue Title</label>
<input type="text" id="issueTitle">

<br><br>

<label>Project Name</label>
<input type="text" id="projectName">

<br><br>

<label>Status</label>
<select id="status">
<option>Open</option>
<option>Closed</option>
</select>

<br><br>

<label>Priority</label>
<select id="priority">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>

<br><br>

<label>Description</label>
<br>
<textarea rows="5" cols="40" id="description"></textarea>

<br><br>

<label>Root Cause</label>
<br>
<textarea rows="5" cols="40" id="rootCause"></textarea>

<br><br>

<label>Solution</label>
<br>
<textarea rows="5" cols="40" id="solution"></textarea>

<br><br>

<button>Update Issue</button>

<br><br>

<a href="view-issues.html">Back</a>

</form>

<script src="js/api.js"></script>
<script src="js/updateIssue.js"></script>

</body>

</html>
